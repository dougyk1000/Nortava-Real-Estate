<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <title>Payment Successful - Nortava</title>

  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <img src="/assets/images/logo/nortava-logo.jpg" alt="Nortava">
        <span>Nortava</span>
      </a>
      <div class="nav-actions">
        <button type="button" class="theme-toggle" aria-label="Toggle theme"><i class="ri-moon-line"></i></button>
      </div>
    </div>
  </header>

  <main style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="card" style="max-width: 500px; width: 100%; text-align: center; padding: 3rem 2rem;">
      <div style="width: 100px; height: 100px; background: rgba(34, 197, 94, 0.1); border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
        <i class="ri-checkbox-circle-fill" style="font-size: 3rem; color: var(--success);"></i>
      </div>
      <h1 id="statusTitle" style="font-size: 2rem; margin-bottom: 0.5rem; color: var(--success);">Verifying Payment...</h1>
      <p id="statusSubtitle" style="color: var(--text-secondary); margin-bottom: 2rem;">Confirming your one-time $2.50 contact unlock with our server.</p>

      <div id="contactBox" style="background: var(--bg-secondary); padding: 1.5rem; border-radius: var(--radius-lg); margin-bottom: 2rem; text-align: left; display: none;">
        <h3 style="font-size: 1rem; margin-bottom: 1rem; color: var(--text-primary);">Landlord Contact</h3>
        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <i class="ri-user-line" style="color: var(--primary);"></i>
            <span id="landlordName">-</span>
          </div>
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <i class="ri-phone-line" style="color: var(--primary);"></i>
            <span id="landlordPhone">-</span>
          </div>
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <i class="ri-mail-line" style="color: var(--primary);"></i>
            <span id="landlordEmail">-</span>
          </div>
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <i class="ri-whatsapp-line" style="color: var(--success);"></i>
            <a href="#" id="whatsappLink" target="_blank" rel="noopener noreferrer" style="color: var(--success);">Chat on WhatsApp</a>
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 1rem;">
        <a href="/dashboard/tenant-unlocked.html" class="btn btn-primary" style="flex: 1;">
          <i class="ri-list-check"></i> View All Contacts
        </a>
        <a href="/listings.html" class="btn btn-secondary" style="flex: 1;">
          <i class="ri-search-line"></i> Browse More
        </a>
      </div>
    </div>
  </main>

  <script type="module" src="/core/main.js"></script>
  <script type="module">
    import { verifyPayment } from '/core/api/api.js';
    import { sanitizePhone } from '/core/utils/sanitize.js';

    async function loadVerifiedContact() {
      const ref = new URLSearchParams(window.location.search).get('ref');
      const titleEl = document.getElementById('statusTitle');
      const subtitleEl = document.getElementById('statusSubtitle');
      const boxEl = document.getElementById('contactBox');

      if (!ref) {
        titleEl.textContent = 'Payment Reference Missing';
        titleEl.style.color = 'var(--danger)';
        subtitleEl.textContent = 'No transaction reference was provided. Check your unlocked contacts in your tenant dashboard.';
        return;
      }

      const { data, error } = await verifyPayment(ref);
      if (error || !data) {
        titleEl.textContent = 'Verification Incomplete';
        titleEl.style.color = 'var(--danger)';
        subtitleEl.textContent = error?.message || 'Could not confirm this payment yet. Check your unlocked contacts or contact support.';
        return;
      }

      titleEl.textContent = 'Payment Successful!';
      subtitleEl.textContent = 'You now have permanent access to the landlord contact details below.';
      const contact = data.landlordContact || {};
      document.getElementById('landlordName').textContent = contact.name || 'Verified Landlord';
      document.getElementById('landlordPhone').textContent = contact.phone || 'Not provided';
      document.getElementById('landlordEmail').textContent = contact.email || 'Not provided';
      const cleanPhone = sanitizePhone(contact.phone || '').replace(/^\+/, '');
      const waLink = document.getElementById('whatsappLink');
      if (cleanPhone) {
        waLink.href = `https://wa.me/${cleanPhone}`;
      } else {
        waLink.style.display = 'none';
      }
      boxEl.style.display = 'block';
    }

    loadVerifiedContact();
  </script>
</body>
</html>
