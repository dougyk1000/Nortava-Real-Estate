<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <title>Edit Listing - Nortava</title>

  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <img src="/assets/images/logo/nortava-logo.jpg" alt="Nortava">
        <span>Nortava</span>
      </a>
      <nav class="nav">
        <ul class="nav-links">
          <li><a href="/dashboard/landlord.html" class="nav-link">Dashboard</a></li>
          <li><a href="/dashboard/landlord-add.html" class="nav-link">Add Listing</a></li>
        </ul>
        <div class="nav-actions">
          <button class="theme-toggle" aria-label="Toggle theme"><i class="ri-moon-line"></i></button>
          <button class="btn btn-ghost" onclick="logout()"><i class="ri-logout-box-line"></i> Logout</button>
        </div>
      </nav>
    </div>
  </header>

  <div class="dashboard-layout">
    <div class="dashboard-container">
      <aside class="sidebar">
        <ul class="sidebar-menu">
          <li class="sidebar-item">
            <a href="/dashboard/landlord.html" class="sidebar-link">
              <i class="ri-dashboard-line"></i>
              <span>Overview</span>
            </a>
          </li>
          <li class="sidebar-item">
            <a href="/dashboard/landlord-add.html" class="sidebar-link">
              <i class="ri-add-circle-line"></i>
              <span>Add Listing</span>
            </a>
          </li>
        </ul>
      </aside>

      <main class="dashboard-main">
        <div class="dashboard-header">
          <h1 class="dashboard-title">Edit Listing</h1>
        </div>

        <form class="card" id="editListingForm" style="max-width: 800px;">
          <h2 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Property Details</h2>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="input-group" style="grid-column: span 2;">
              <label for="title">Property Title</label>
              <input type="text" id="title" class="input" required>
            </div>

            <div class="input-group">
              <label for="type">Listing Type</label>
              <select id="type" class="input" required>
                <option value="rent">For Rent</option>
                <option value="sale">For Sale</option>
              </select>
            </div>

            <div class="input-group">
              <label for="price">Price (USD)</label>
              <input type="number" id="price" class="input" required min="1">
            </div>

            <div class="input-group">
              <label for="rooms">Bedrooms</label>
              <select id="rooms" class="input" required>
                <option value="1">1 Bedroom</option>
                <option value="2">2 Bedrooms</option>
                <option value="3">3 Bedrooms</option>
                <option value="4">4 Bedrooms</option>
                <option value="5">5+ Bedrooms</option>
              </select>
            </div>

            <div class="input-group">
              <label for="bathrooms">Bathrooms</label>
              <select id="bathrooms" class="input">
                <option value="1">1 Bathroom</option>
                <option value="2">2 Bathrooms</option>
                <option value="3">3+ Bathrooms</option>
              </select>
            </div>

            <div class="input-group">
              <label for="size">Size (sqft)</label>
              <input type="number" id="size" class="input">
            </div>

            <div class="input-group">
              <label for="province">Province</label>
              <select id="province" class="input" required></select>
            </div>

            <div class="input-group">
              <label for="city">City / Town / District</label>
              <select id="city" class="input" required></select>
            </div>

            <div class="input-group">
              <label for="area">Suburb / Area</label>
              <select id="area" class="input" required></select>
            </div>

            <div class="input-group">
              <label for="locationDetail">Street / Phase / Custom Area (Optional)</label>
              <input type="text" id="locationDetail" class="input" placeholder="Optional street, phase, or stand">
              <small id="locationPreview" style="color: var(--text-tertiary); font-size: 0.78rem;"></small>
            </div>

            <div class="input-group" style="grid-column: span 2;">
              <label for="description">Description</label>
              <textarea id="description" class="input" rows="5" required></textarea>
            </div>
          </div>

          <div style="margin-top: 2rem; display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="ri-save-line"></i> Save Changes
            </button>
            <button type="button" class="btn btn-danger btn-lg" id="deleteBtn">
              <i class="ri-delete-bin-line"></i> Delete Listing
            </button>
            <a href="/dashboard/landlord.html" class="btn btn-secondary btn-lg">Cancel</a>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script type="module" src="/core/main.js"></script>
  <script type="module">
    import { getListingById, updateListing, deleteListing, getCurrentUser } from '/core/api/api.js';
    import { showToast } from '/core/utils/toast.js';
    import { logout } from '/core/auth/auth.js';
    import { initListingLocationPicker } from '/core/locations/locationSelector.js';
    window.logout = logout;

    const locationPicker = initListingLocationPicker({
      provinceEl: document.getElementById('province'),
      cityEl: document.getElementById('city'),
      areaEl: document.getElementById('area'),
      detailEl: document.getElementById('locationDetail'),
      previewEl: document.getElementById('locationPreview'),
      defaultProvince: 'Mashonaland West',
      defaultCity: 'Norton'
    });

    const params = new URLSearchParams(window.location.search);
    const listingId = params.get('id');
    let currentUser = null;
    let deleteConfirmed = false;

    document.addEventListener('DOMContentLoaded', async () => {
      currentUser = await getCurrentUser();
      if (!currentUser) {
        window.location.href = '/auth/login.html';
        return;
      }
      if (!listingId) {
        window.location.href = '/dashboard/landlord.html';
        return;
      }
      loadListing();
    });

    async function loadListing() {
      const { data: listing, error } = await getListingById(listingId);
      if (error || !listing) {
        showToast('Error', 'Listing not found', 'error');
        window.location.href = '/dashboard/landlord.html';
        return;
      }

      if (listing.user_id !== currentUser.id) {
        showToast('Access Denied', 'You do not own this listing.', 'error');
        setTimeout(() => { window.location.href = '/dashboard/landlord.html'; }, 1000);
        return;
      }

      document.getElementById('title').value = listing.title;
      document.getElementById('type').value = listing.type;
      document.getElementById('price').value = listing.price;
      document.getElementById('rooms').value = listing.rooms;
      document.getElementById('bathrooms').value = listing.bathrooms || 1;
      document.getElementById('size').value = listing.size || '';
      locationPicker.setLocationFromString(listing.location || '');
      document.getElementById('description').value = listing.description;
    }

    document.getElementById('editListingForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading-spinner"></span> Saving...';

      const updates = {
        title: document.getElementById('title').value.trim(),
        type: document.getElementById('type').value,
        price: parseFloat(document.getElementById('price').value),
        rooms: parseInt(document.getElementById('rooms').value, 10),
        bathrooms: parseInt(document.getElementById('bathrooms').value, 10),
        size: document.getElementById('size').value || null,
        location: locationPicker.getLocationString(),
        description: document.getElementById('description').value.trim()
      };

      const { error } = await updateListing(listingId, updates);

      if (error) {
        showToast('Error', error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="ri-save-line"></i> Save Changes';
        return;
      }

      showToast('Success', 'Listing updated successfully', 'success');
      setTimeout(() => {
        window.location.href = '/dashboard/landlord.html';
      }, 1500);
    });

    const deleteBtn = document.getElementById('deleteBtn');
    deleteBtn.addEventListener('click', async () => {
      if (!deleteConfirmed) {
        deleteConfirmed = true;
        deleteBtn.innerHTML = '<i class="ri-error-warning-line"></i> Click Again to Confirm Delete';
        setTimeout(() => {
          deleteConfirmed = false;
          deleteBtn.innerHTML = '<i class="ri-delete-bin-line"></i> Delete Listing';
        }, 4000);
        return;
      }

      const { error } = await deleteListing(listingId);
      if (error) {
        showToast('Error', 'Failed to delete listing', 'error');
        return;
      }

      showToast('Deleted', 'Listing has been removed', 'success');
      setTimeout(() => {
        window.location.href = '/dashboard/landlord.html';
      }, 1500);
    });
  </script>
</body>
</html>
