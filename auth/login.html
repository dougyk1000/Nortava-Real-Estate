<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Nortava Real Estate account to manage verified Zimbabwe property listings, saved homes, and unlocked landlord contacts.">
  <meta name="keywords" content="login, sign in, real estate account, Nortava">
  <meta name="author" content="Douglas Kowo">
  <meta name="theme-color" content="#0f172a">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nortava Real Estate">
  <meta property="og:title" content="Sign In – Nortava Real Estate">
  <meta property="og:description" content="Sign in to your Nortava Real Estate account to manage verified Zimbabwe property listings, saved homes, and unlocked landlord contacts.">
  <meta property="og:image" content="/assets/images/nortava-og-card.jpg">
  <meta property="og:logo" content="/assets/images/logo/nortava-logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sign In – Nortava Real Estate">
  <meta name="twitter:description" content="Sign in to your Nortava Real Estate account.">
  <meta name="twitter:image" content="/assets/images/nortava-og-card.jpg">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <title>Sign In – Nortava Real Estate</title>

  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <button type="button" class="theme-toggle auth-theme-toggle" aria-label="Toggle theme"><i class="ri-moon-line"></i></button>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="logo">
          <img src="/assets/images/logo/nortava-logo.jpg" alt="Nortava" style="height: 48px;">
        </a>
        <h1>Welcome Back</h1>
        <p>Sign in to your Nortava account</p>
      </div>

      <div id="loginStatusBanner" style="display: none; padding: 0.9rem 1rem; border-radius: var(--radius-lg); margin-bottom: 1.25rem; font-size: 0.875rem; line-height: 1.5; border: 1px solid var(--border);"></div>

      <form class="auth-form" id="loginForm">
        <div class="input-group">
          <label for="email">Email Address</label>
          <div class="input-icon">
            <i class="ri-mail-line"></i>
            <input type="email" id="email" class="input" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-icon">
            <i class="ri-lock-line"></i>
            <input type="password" id="password" class="input" placeholder="Enter your password" required>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label class="checkbox-group">
            <input type="checkbox" id="remember">
            <span>Remember me</span>
          </label>
          <a href="#" id="forgotPasswordLink" style="color: var(--primary); font-size: 0.875rem;">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg">
          <i class="ri-login-box-line"></i> Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/auth/register.html">Create one</a>
      </div>
    </div>
  </div>

  <div id="forgotPasswordModal" class="consent-modal-backdrop" style="display: none;" role="dialog" aria-modal="true" aria-label="Reset Password">
    <div class="consent-modal">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h3 style="margin: 0;">Reset Your Password</h3>
        <button type="button" id="closeForgotModal" aria-label="Close" style="background: none; font-size: 1.5rem; color: var(--text-secondary);">
          <i class="ri-close-line"></i>
        </button>
      </div>
      <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1rem;">
        Enter the email address associated with your account and we will send a password reset link.
      </p>
      <form id="forgotPasswordForm" style="display: flex; flex-direction: column; gap: 1rem;">
        <div class="input-group">
          <label for="resetEmail">Email Address</label>
          <input type="email" id="resetEmail" class="input" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="btn btn-primary">Send Reset Link</button>
      </form>
    </div>
  </div>

  <script type="module" src="/core/main.js"></script>
  <script type="module" src="/core/auth/auth.js"></script>
</body>
</html>
