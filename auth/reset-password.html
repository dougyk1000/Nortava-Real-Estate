<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your Nortava account password securely.">
  <meta name="keywords" content="reset password, forgot password, Nortava">
  <meta name="author" content="Douglas Kowo">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Reset Password - Nortava">
  <meta property="og:description" content="Set a new password for your Nortava account.">
  <meta property="og:image" content="/assets/images/logo/nortava-logo.jpg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Reset Password - Nortava">
  <link rel="icon" type="image/jpeg" href="/assets/images/logo/nortava-logo.jpg">
  <link rel="apple-touch-icon" href="/assets/images/logo/nortava-logo.jpg">
  <title>Reset Password - Nortava</title>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="logo">
          <img src="/assets/images/logo/nortava-logo.jpg" alt="Nortava" style="height: 48px;">
        </a>
        <h1 id="resetPageHeading">Reset Password</h1>
        <p id="resetPageSubheading">Recover access to your Nortava account</p>
      </div>

      <div id="resetStatusBanner" style="display: none; padding: 0.9rem 1rem; border-radius: var(--radius-lg); margin-bottom: 1.25rem; font-size: 0.875rem; line-height: 1.5; border: 1px solid var(--border);"></div>

      <section id="setNewPasswordSection" style="display: none;">
        <form class="auth-form" id="newPasswordForm">
          <div class="input-group">
            <label for="newPassword">New Password</label>
            <div class="input-icon">
              <i class="ri-lock-password-line"></i>
              <input type="password" id="newPassword" class="input" placeholder="Minimum 8 characters" minlength="8" required>
            </div>
          </div>

          <div class="input-group">
            <label for="confirmNewPassword">Confirm New Password</label>
            <div class="input-icon">
              <i class="ri-lock-line"></i>
              <input type="password" id="confirmNewPassword" class="input" placeholder="Re-enter your new password" minlength="8" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg">
            <i class="ri-check-double-line"></i> Update Password
          </button>
        </form>
      </section>

      <section id="requestResetSection">
        <form class="auth-form" id="requestResetForm">
          <div class="input-group">
            <label for="resetRequestEmail">Email Address</label>
            <div class="input-icon">
              <i class="ri-mail-line"></i>
              <input type="email" id="resetRequestEmail" class="input" placeholder="you@example.com" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg">
            <i class="ri-mail-send-line"></i> Send Reset Link
          </button>
        </form>
      </section>

      <div class="auth-footer">
        Remembered your password? <a href="/auth/login.html">Back to Sign In</a>
      </div>
    </div>
  </div>

  <script type="module" src="/core/main.js"></script>
  <script type="module" src="/core/auth/auth.js"></script>
</body>
</html>
